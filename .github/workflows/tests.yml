# 测试分层 CI(2026-09-11 立,2026-09-13 分片化):本地迭代只守
# npm run gate(秒级),全量测试放这里跑——迭代敏捷,不被低质量
# 覆盖阻塞;md-only 提交不触发(测试纪律:慢而弱的覆盖没有阻塞资格)。
#
# 两个 job:
# - gate(阻塞):typecheck + web 构建 + 秒级契约,红即挡;
# - full-suite(阻塞,2026-09-14 起):全量 npm test 按 3 分片
#   并行跑(文件名哈希分桶,无需维护清单),红即挡。存量已知红已于
#   2026-09-14 清零(隔离标记全摘,归因见
#   docs/test-suite-efficiency-2026-09-11.md)。
#
# CI 排除 prepushRecovery/hostPushRecovery(serve 重启恢复族):
# 本地空闲全绿、CI 环境必挂——恢复轮对 runner 环境敏感,6 例各烧满
# 180s 超时(18 分钟/轮,CI 时间最大单点)。覆盖不删:本地 npm test
# 照跑;根因清理后可移出排除名单。容器真件与 PG 用例在 CI 缺镜像/
# 缺库环境自动跳过(与本地无 docker 同款分层);内核是仓内收编
# kernel/,无需额外 checkout。

name: tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate(阻塞)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: 安装依赖(根)
        run: npm ci
      - name: 安装依赖(web)
        run: npm ci
        working-directory: web
      - name: gate(typecheck + web 构建 + 秒级契约)
        run: npm run -s gate

  full-suite:
    name: 全量(阻塞, 分片 ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: 安装依赖(根)
        run: npm ci
      - name: 安装依赖(web)
        run: npm ci
        working-directory: web
      - name: 本分片用例清单(文件名哈希分桶)
        id: files
        run: |
          SHARDS=3
          IDX=${{ matrix.shard }}
          for f in tests/*.test.ts; do
            case "$f" in
              *prepushRecovery*|*hostPushRecovery*) continue ;;
            esac
            h=$(basename "$f" | cksum | cut -d' ' -f1)
            (( h % SHARDS == IDX )) && printf '%s\n' "$f"
          done > shard-files.txt
          echo "count=$(wc -l < shard-files.txt)" >> "$GITHUB_OUTPUT"
      - name: 全量测试(本分片)
        id: tests
        run: |
          set -o pipefail
          mapfile -t files < shard-files.txt
          MFC_TEST_CONCURRENCY=4 npx tsx --test \
            --test-timeout=180000 --test-force-exit \
            "${files[@]}" 2>&1 | tee test-log.txt
      - name: 汇总到 job summary
        if: always()
        run: |
          {
            echo "## 全量测试报告——分片 ${{ matrix.shard }}(${{ steps.files.outputs.count }} 文件,阻塞)"
            if grep -qE "^ℹ tests " test-log.txt; then
              grep -E "^ℹ (tests|pass|fail|skipped|duration_ms)" test-log.txt
              echo
              echo "失败用例:"
              grep -E "^✖" test-log.txt | grep -v "failing tests" \
                | sort -u | head -40 || echo "(无)"
            else
              echo ":x: **分片没有真正跑起来**(基础设施失败)——看日志工件排查"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.shard }}-${{ github.run_id }}
          path: test-log.txt
          retention-days: 7
